[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridor-optimizer"
version = "0.1.0"
description = "Least-cost ecological corridor identification using Dijkstra's algorithm on ESA WorldCover 2021 resistance surfaces"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "rasterio>=1.3.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
web = [
    "streamlit>=1.28.0",
    "folium>=0.14.0",
]
geo = [
    "geopandas>=0.14.0",
    "requests>=2.31.0",
]

[project.scripts]
corridor-optimizer = "corridor_optimizer.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["corridor_optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false